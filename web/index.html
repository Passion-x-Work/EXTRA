<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>EXTRA · 역사에 끼어든 단역</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 화면 1: 지도(고지도) -->
      <section id="scr-map" class="screen active">
        <div class="brand">
          <h1 class="logo">EXTRA</h1>
          <span class="brand-seal">端<br />役</span>
        </div>
        <p class="tagline">역사에 끼어든 <b>단역</b>이 되어, 실존 인물을 설득하라</p>
        <div class="relics">
          <button class="relic" data-char="sejong">
            <span class="relic-loc">경복궁 · 조선</span>
            <span class="relic-name">훈민정음</span>
            <span class="relic-sub">세종대왕 · 완성</span>
          </button>
          <button class="relic" data-char="vangogh">
            <span class="relic-loc">생레미 · 프랑스</span>
            <span class="relic-name">별이 빛나는 밤</span>
            <span class="relic-sub">반 고흐 · 맛보기</span>
          </button>
          <button class="relic disabled" disabled>
            <span class="relic-loc">일본</span>
            <span class="relic-name">미야자키</span>
            <span class="relic-sub">준비 중</span>
          </button>
        </div>
        <div class="map-foot">
          <div class="diff-select" id="diff-select">
            <span class="diff-label">난이도</span>
            <button class="diff" data-diff="easy">이지</button>
            <button class="diff active" data-diff="mid">미디움</button>
            <button class="diff" data-diff="hard">하드</button>
          </div>
          <button id="open-dogam" class="ghost-btn">사료 도감</button>
        </div>
      </section>

      <!-- 화면 2: 대화 -->
      <section id="scr-chat" class="screen" data-theme="sejong">
        <header class="chat-head">
          <div class="who"><span id="char-name">세종대왕</span><small id="char-diff"></small></div>
          <div class="gauge"><div id="gauge-fill" class="gauge-fill"></div><span id="gauge-num">40</span></div>
          <select id="provider" class="ctl" title="판정 엔진">
            <option value="offline">오프라인</option>
            <option value="gpt">GPT</option>
            <option value="claude">Claude</option>
          </select>
          <button id="tone-toggle" class="ctl" title="말투 전환">정통</button>
        </header>
        <div id="axis-track" class="axis-track" title="설득의 축 — 찾으면 공개"></div>
        <div id="log" class="log"></div>
        <form id="turn-form" class="turn-form">
          <input id="turn-input" type="text" autocomplete="off" placeholder="인물에게 건넬 논거를 입력…" />
          <button type="submit" aria-label="보내기">▶</button>
        </form>
        <div id="turn-count" class="turn-count">턴 0</div>
      </section>

      <!-- 화면 3: 결과(낙관 찍힌 문서) -->
      <section id="scr-result" class="screen">
        <div class="card" id="result-card">
          <div class="seal" id="win-seal">端<br />役</div>
          <div id="result-title" class="card-title">설득 성공</div>
          <div id="result-line" class="card-line"></div>
          <div class="card-meta"><span id="result-turns"></span><span id="result-grade" class="grade"></span></div>
          <div id="result-cta" class="card-cta"></div>
          <div id="result-cards" class="result-cards"></div>
        </div>
        <div class="result-actions">
          <button id="save-card" class="retry retry--alt">카드 저장</button>
          <button id="retry" class="retry">다시 도전</button>
        </div>
      </section>

      <!-- 사료 도감 -->
      <section id="scr-dogam" class="screen">
        <header class="dogam-head">
          <h2>사료 도감</h2>
          <button id="close-dogam" class="ctl">닫기</button>
        </header>
        <div id="dogam-list" class="dogam-list"></div>
      </section>
    </div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
